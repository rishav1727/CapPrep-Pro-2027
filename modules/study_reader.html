<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CapPrep Pro — Protected In-Browser PDF Master Reader</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:;"/>
  <meta http-equiv="X-Content-Type-Options" content="nosniff"/>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    /* Reader Layout */
    html, body {
      height: 100%;
      margin: 0;
      background: #060c18;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Protection styles: prevent printing & downloading */
    @media print {
      body { display: none !important; }
      html::after {
        content: "PROTECTED CONTENT — PRINTING IS STRICTLY PROHIBITED";
        font-size: 2rem; color: red; display: block; text-align: center; padding-top: 20%;
      }
    }

    .reader-wrapper {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Reader Header & Toolbar */
    .reader-toolbar {
      background: #0b1528;
      border-bottom: 1px solid rgba(0, 212, 255, 0.2);
      padding: 0.6rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      z-index: 100;
    }

    .reader-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 800;
      font-size: 0.95rem;
      color: #fff;
    }

    .doc-selector {
      background: #111f38;
      border: 1px solid rgba(0, 212, 255, 0.3);
      color: #fff;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .doc-selector option {
      background: #0a1628;
      color: #fff;
    }

    .toolbar-tools {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.2s;
    }

    .tool-btn:hover {
      background: rgba(0, 212, 255, 0.15);
      border-color: var(--accent);
      color: #fff;
    }

    .security-badge {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    /* Main Area: Sidebar + Book Pages */
    .reader-main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Left Table of Contents Sidebar */
    .reader-sidebar {
      width: 290px;
      background: #081122;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.3s ease;
    }

    .reader-sidebar.collapsed {
      width: 0;
      border: none;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .sidebar-toc {
      flex: 1;
      overflow-y: auto;
      padding: 0.6rem 0.5rem;
      list-style: none;
      margin: 0;
    }

    .toc-item {
      padding: 0.6rem 0.8rem;
      font-size: 0.8rem;
      color: #94a3b8;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
      margin-bottom: 0.2rem;
    }

    .toc-item:hover, .toc-item.active {
      background: rgba(0, 212, 255, 0.12);
      color: #00d4ff;
      font-weight: 700;
    }

    /* Document Viewport & Pages */
    .reader-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 2.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #040812;
      position: relative;
    }

    /* PDF Style Sheet Page */
    .pdf-page {
      width: 100%;
      max-width: 900px;
      min-height: 1100px;
      background: #0d1a33;
      border: 1px solid rgba(0, 212, 255, 0.25);
      border-radius: 8px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 212, 255, 0.05);
      padding: 3rem 3.5rem;
      box-sizing: border-box;
      position: relative;
      margin-bottom: 2rem;
      font-size: 0.94rem;
      line-height: 1.7;
      color: #e2e8f0;
    }

    /* Theme Variations */
    .theme-paper .pdf-page {
      background: #fdfdfd;
      color: #1e293b;
      border-color: #cbd5e1;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    .theme-paper .pdf-page h1, .theme-paper .pdf-page h2, .theme-paper .pdf-page h3, .theme-paper .pdf-page h4 {
      color: #0f172a !important;
    }
    .theme-paper .pdf-page .pdf-header {
      border-bottom-color: #e2e8f0;
      color: #64748b;
    }
    .theme-paper .pdf-page .pdf-footer {
      border-top-color: #e2e8f0;
      color: #64748b;
    }
    .theme-paper .code-block {
      background: #0f172a;
      color: #38bdf8;
    }

    .theme-sepia .pdf-page {
      background: #fbf0d9;
      color: #433422;
      border-color: #e3d2b3;
    }
    .theme-sepia .pdf-page h1, .theme-sepia .pdf-page h2, .theme-sepia .pdf-page h3 {
      color: #2b1f13 !important;
    }

    /* Watermark */
    .pdf-watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-35deg);
      font-size: 3.5rem;
      font-weight: 900;
      color: rgba(0, 212, 255, 0.035);
      pointer-events: none;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 4px;
      z-index: 1;
    }
    .theme-paper .pdf-watermark {
      color: rgba(0, 0, 0, 0.04);
    }

    .pdf-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.75rem;
      margin-bottom: 2rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .pdf-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 0.75rem;
      margin-top: 3rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .pdf-page h1 {
      font-size: 1.85rem;
      color: #fff;
      margin: 0 0 0.5rem 0;
      font-weight: 800;
    }

    .pdf-page h2 {
      font-size: 1.35rem;
      color: #38bdf8;
      margin: 2rem 0 0.75rem 0;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      padding-bottom: 0.35rem;
    }

    .pdf-page h3 {
      font-size: 1.1rem;
      color: #a78bfa;
      margin: 1.5rem 0 0.5rem 0;
    }

    .pdf-page p {
      margin-bottom: 1rem;
    }

    .pdf-callout {
      background: rgba(0, 212, 255, 0.06);
      border-left: 4px solid var(--accent);
      padding: 1rem 1.25rem;
      border-radius: 0 8px 8px 0;
      margin: 1.25rem 0;
    }

    .pdf-callout.tip {
      border-left-color: #06d6a0;
      background: rgba(6, 214, 160, 0.06);
    }

    .pdf-callout.warn {
      border-left-color: #f59e0b;
      background: rgba(245, 158, 11, 0.06);
    }

    .code-block {
      background: #070e1c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 1rem;
      font-family: 'Fira Code', Consolas, monospace;
      font-size: 0.85rem;
      overflow-x: auto;
      margin: 1rem 0;
      color: #38bdf8;
      line-height: 1.55;
    }

    .pdf-table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.25rem 0;
      font-size: 0.85rem;
    }

    .pdf-table th, .pdf-table td {
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.65rem 0.9rem;
      text-align: left;
    }

    .pdf-table th {
      background: rgba(0, 212, 255, 0.1);
      color: #fff;
      font-weight: 700;
    }

    .theme-paper .pdf-table th {
      background: #f1f5f9;
      color: #0f172a;
      border-color: #cbd5e1;
    }
    .theme-paper .pdf-table td {
      border-color: #e2e8f0;
    }

    /* Page Navigation Bottom Float */
    .page-nav-bar {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(11, 21, 40, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 212, 255, 0.3);
      border-radius: 30px;
      padding: 0.4rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      z-index: 90;
    }

    .page-indicator {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
    }
  </style>
</head>
<body>

<div class="reader-wrapper" id="readerRoot">

  <!-- ===== TOOLBAR ===== -->
  <div class="reader-toolbar">
    <div class="reader-brand">
      <button class="tool-btn" onclick="toggleSidebar()" title="Toggle Table of Contents">☰ Index</button>
      <span>📖 CapPrep Master Reader</span>
      <select class="doc-selector" id="stageSelect" onchange="loadStageDoc(this.value)">
        <option value="stage1">Stage 1: English & AI Spoken Communication Guide</option>
        <option value="stage2a">Stage 2A: Technical Assessment & CS Compendium</option>
        <option value="stage2b">Stage 2B: Algorithmic Debugging Master Handbook</option>
        <option value="stage3">Stage 3: Lab 27 AI Coding & Prompt Engineering Manual</option>
        <option value="stage4">Stage 4: Cognitive Games & ADEPT-15 Behavioral Dossier</option>
        <option value="stage56">Stages 5-6: Tech & HR Interview Defense Playbook</option>
      </select>
    </div>

    <div class="toolbar-tools">
      <div class="security-badge">
        <span>🔒</span> Protected DRM • In-Browser Read Only
      </div>
      <button class="tool-btn" onclick="cycleTheme()" id="themeBtn">🌓 Theme: Dark</button>
      <button class="tool-btn" onclick="zoomDoc(-0.1)">🔍−</button>
      <button class="tool-btn" onclick="zoomDoc(0.1)">🔍+</button>
      <button class="tool-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
      <button class="tool-btn" style="background:#334155;" onclick="location.href='../index.html'">✕ Exit</button>
    </div>
  </div>

  <!-- ===== MAIN BODY ===== -->
  <div class="reader-main">

    <!-- Table of Contents Sidebar -->
    <div class="reader-sidebar" id="sidebar">
      <div class="sidebar-header" id="tocHeader">Chapters</div>
      <ul class="sidebar-toc" id="tocList"></ul>
    </div>

    <!-- Document Viewport -->
    <div class="reader-viewport" id="viewport">
      <div class="pdf-page" id="docPage">
        <div class="pdf-watermark">CAPPREP PRO • EXCELLER 2027 • PROTECTED</div>
        <div class="pdf-header">
          <span id="headerDocTitle">CapPrep Pro Official Syllabus</span>
          <span>Candidate Copy #2027-SECURE</span>
        </div>

        <div id="pageContent">
          <!-- Injected via JavaScript based on selected Stage -->
        </div>

        <div class="pdf-footer">
          <span>Capgemini Exceller 2027 Official Preparation Compendium</span>
          <span id="footerPageNumber">Page 1 of 6</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Page Navigation Bar -->
  <div class="page-nav-bar">
    <button class="tool-btn" onclick="prevPage()">◀ Prev</button>
    <span class="page-indicator" id="navPageIndicator">Section 1 / 6</span>
    <button class="tool-btn" onclick="nextPage()">Next ▶</button>
  </div>

</div>

<!-- ===== LOAD COMPREHENSIVE TEXTBOOK-GRADE STUDY COMPENDIUM ===== -->
<script src="../js/study_docs.js"></script>
<script>

// ==========================================
// VIEWER ENGINE (STATE & INTERACTION)
// ==========================================

let currentStageKey = 'stage1';
let currentSectionIdx = 0;
let currentZoom = 1.0;
let currentThemeIdx = 0;
const themes = ['', 'theme-paper', 'theme-sepia'];
const themeNames = ['Dark Slate', 'Paper White', 'Vintage Sepia'];

function loadStageDoc(stageKey) {
  currentStageKey = stageKey;
  currentSectionIdx = 0;
  
  const doc = STAGE_DOCS[stageKey];
  if (!doc) return;

  document.getElementById('headerDocTitle').textContent = doc.title;
  
  // Build Table of Contents
  const tocList = document.getElementById('tocList');
  tocList.innerHTML = doc.sections.map((sec, idx) => `
    <li class="toc-item ${idx === 0 ? 'active' : ''}" onclick="goToSection(${idx})">
      <span>📄</span> ${sec.title}
    </li>
  `).join('');

  renderCurrentSection();
}

function renderCurrentSection() {
  const doc = STAGE_DOCS[currentStageKey];
  if (!doc) return;

  const sec = doc.sections[currentSectionIdx];
  if (!sec) return;

  const contentArea = document.getElementById('pageContent');
  contentArea.innerHTML = sec.content;

  // Update indicators
  const total = doc.sections.length;
  document.getElementById('navPageIndicator').textContent = `Section ${currentSectionIdx + 1} of ${total}`;
  document.getElementById('footerPageNumber').textContent = `Section ${currentSectionIdx + 1} of ${total} • ${doc.title}`;

  // Update TOC active state
  document.querySelectorAll('.toc-item').forEach((item, idx) => {
    item.classList.toggle('active', idx === currentSectionIdx);
  });

  // Scroll to top of page
  document.getElementById('viewport').scrollTop = 0;
}

function prevPage() {
  if (currentSectionIdx > 0) {
    currentSectionIdx--;
    renderCurrentSection();
  }
}

function nextPage() {
  const doc = STAGE_DOCS[currentStageKey];
  if (doc && currentSectionIdx < doc.sections.length - 1) {
    currentSectionIdx++;
    renderCurrentSection();
  }
}

function goToSection(idx) {
  currentSectionIdx = idx;
  renderCurrentSection();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

function cycleTheme() {
  currentThemeIdx = (currentThemeIdx + 1) % themes.length;
  document.getElementById('readerRoot').className = 'reader-wrapper ' + themes[currentThemeIdx];
  document.getElementById('themeBtn').textContent = '🌓 Theme: ' + themeNames[currentThemeIdx];
}

function zoomDoc(delta) {
  currentZoom = Math.min(1.4, Math.max(0.8, currentZoom + delta));
  document.getElementById('docPage').style.transform = `scale(${currentZoom})`;
  document.getElementById('docPage').style.transformOrigin = 'top center';
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}

// Anti-tamper & Anti-Copy
document.addEventListener('contextmenu', e => {
  e.preventDefault();
  alert("🔒 DRM Notice: Study material is protected. Copying and printing are disabled.");
});

document.addEventListener('keydown', e => {
  if (e.ctrlKey && (e.key === 'p' || e.key === 'P' || e.key === 's' || e.key === 'S')) {
    e.preventDefault();
    alert("🔒 DRM Notice: Downloading or printing this compendium is strictly disabled.");
  }
});

// Check query param for initial stage
window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const initialStage = params.get('stage') || 'stage1';
  if (STAGE_DOCS[initialStage]) {
    document.getElementById('stageSelect').value = initialStage;
    loadStageDoc(initialStage);
  } else {
    loadStageDoc('stage1');
  }
});
</script>
</body>
</html>
